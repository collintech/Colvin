services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [colvin-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'PING']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [colvin-network]

  vin-decoder:
    build:
      context: ./apps/services-go/vin-decoder
    restart: unless-stopped
    environment:
      PORT: 8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      VIN_PROVIDER_MODE: ${VIN_PROVIDER_MODE:-local}
      VIN_PROVIDER_TIMEOUT_MS: ${VIN_PROVIDER_TIMEOUT_MS:-4000}
      VINCARIO_BASE_URL: ${VINCARIO_BASE_URL:-https://api.vincario.com/3.2}
      VINCARIO_API_KEY: ${VINCARIO_API_KEY:-}
      VINCARIO_SECRET_KEY: ${VINCARIO_SECRET_KEY:-}
    expose: ['8081']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [colvin-network]

  history-service:
    build:
      context: ./apps/services-go/history-service
    restart: unless-stopped
    environment:
      PORT: 8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      HISTORY_PROVIDER_MODE: ${HISTORY_PROVIDER_MODE:-local}
      HISTORY_PROVIDER_TIMEOUT_MS: ${HISTORY_PROVIDER_TIMEOUT_MS:-4000}
      HISTORY_PROVIDER_REFRESH_TTL_HOURS: ${HISTORY_PROVIDER_REFRESH_TTL_HOURS:-24}
      HISTORY_PROVIDER_ERROR_TTL_MINUTES: ${HISTORY_PROVIDER_ERROR_TTL_MINUTES:-15}
      VINCARIO_BASE_URL: ${VINCARIO_BASE_URL:-https://api.vincario.com/3.2}
      VINCARIO_API_KEY: ${VINCARIO_API_KEY:-}
      VINCARIO_SECRET_KEY: ${VINCARIO_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ['8082']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8082/health']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [colvin-network]

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vin-decoder:
        condition: service_healthy
      history-service:
        condition: service_healthy
    ports:
      - '${API_PORT:-4000}:4000'
    networks: [colvin-network]

  web-client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on: [api-gateway]
    ports:
      - '${WEB_PORT:-5173}:80'
    networks: [colvin-network]

volumes:
  postgres-data:
  redis-data:

networks:
  colvin-network:
    driver: bridge
