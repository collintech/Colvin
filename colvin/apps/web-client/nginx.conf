# Keep original paths for diagnosis while excluding query strings and referrers.
map $request_uri $colvin_log_path {
  ~^(?<colvin_path_without_args>[^?]*) $colvin_path_without_args;
}

log_format colvin_access escape=json
  '{"time":"$time_iso8601","request_id":"$request_id",'
  '"method":"$request_method","path":"$colvin_log_path",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log colvin_access;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # Re-resolve Railway private service addresses after deployments.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=2s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-store" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Production uses same-origin API traffic. The browser never needs direct
  # access to the API Gateway container.
  location /api/ {
    # Using a variable enables Nginx runtime DNS lookups.
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
