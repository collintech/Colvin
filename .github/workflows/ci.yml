name: Colvin CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colvin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.27.1'

defaults:
  run:    
    working-directory: colvin

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: colvin/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: colvin/apps/services-go/history-service/go.sum

      - name: Install Node dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colvin_ci
          POSTGRES_USER: colvin_ci
          POSTGRES_PASSWORD: colvin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colvin_ci -d colvin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: colvin/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: colvin/apps/services-go/history-service/go.sum

      - name: Install Node dependencies
        run: npm ci

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'ENV'
          NODE_ENV=test
          WEB_ORIGIN=http://localhost:5173
          ACCOUNT_WEB_URL=http://localhost:5173

          POSTGRES_DB=colvin_ci
          POSTGRES_USER=colvin_ci
          POSTGRES_PASSWORD=colvin_ci_password
          MIGRATION_DATABASE_URL=postgresql://colvin_ci:colvin_ci_password@localhost:5432/colvin_ci
          DATABASE_URL=postgresql://colvin_ci:colvin_ci_password@localhost:5432/colvin_ci

          INTEGRATION_REDIS_URL=redis://localhost:6379
          REDIS_URL=redis://localhost:6379

          JWT_ACCESS_SECRET=colvin-ci-access-secret-not-for-production-0123456789
          JWT_REFRESH_SECRET=colvin-ci-refresh-secret-not-for-production-0123456789
          INTERNAL_API_KEY=colvin-ci-internal-key-not-for-production

          EMAIL_PROVIDER=test
          PASSWORD_COMPROMISE_CHECK=disabled
          VIN_PROVIDER_MODE=local
          HISTORY_PROVIDER_MODE=local
          LOG_LEVEL=silent
          ENV

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify migration idempotency
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create container test environment
        shell: bash
        run: |
          cat > .env <<'ENV'
          NODE_ENV=development

          WEB_PORT=5173
          API_PORT=4000
          WEB_ORIGIN=http://localhost:5173
          ACCOUNT_WEB_URL=http://localhost:5173
          VITE_API_BASE_URL=/api/v1

          POSTGRES_DB=colvin_ci
          POSTGRES_USER=colvin_ci
          POSTGRES_PASSWORD=colvin_ci_password
          POSTGRES_PORT=5432

          REDIS_PASSWORD=colvin_ci_redis_password
          REDIS_PORT=6379

          JWT_ACCESS_SECRET=colvin-container-access-secret-not-for-production-0123456789
          JWT_REFRESH_SECRET=colvin-container-refresh-secret-not-for-production-0123456789
          INTERNAL_API_KEY=colvin-container-internal-key-not-for-production

          EMAIL_PROVIDER=test
          PASSWORD_COMPROMISE_CHECK=disabled
          VIN_PROVIDER_MODE=local
          HISTORY_PROVIDER_MODE=local
          LOG_LEVEL=silent
          ENV

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if docker compose build; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "Docker image build failed after two attempts."
              exit 1
            fi

            echo "Docker build failed once; retrying after a short delay."
            sleep 10
          done

      - name: Start full stack
        run: timeout 5m docker compose up -d --wait

      - name: Verify web edge health
        run: curl --fail --silent --show-error http://localhost:5173/healthz

      - name: Show container state
        run: docker compose ps -a

      - name: Capture container diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 || true

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
